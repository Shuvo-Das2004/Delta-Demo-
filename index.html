<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            background: #1e293b;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
        }

        header h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 120px 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .hero span {
            color: #38bdf8;
        }

        .hero p {
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        button {
            background: #38bdf8;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0284c7;
            color: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1e293b;
        }
    </style>
</head>

<body>

    <header>
        <h2>MyPortfolio</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Hello, I'm <span>Shuvo!</span></h1>

        <p>
            Computer Science Student | Web Developer | Programmer
        </p>

        <button onclick="showMessage()">
            Contact Me
        </button>
    </section>

    <footer>
        <p>&copy; 2026 My Portfolio. All Rights Reserved.</p>
    </footer>

    <script>
        function showMessage() {
            alert("Thanks for visiting my portfolio!");
        }
    </script>

</body>

</html>
